# This is a basic workflow to help you get started with Actions

name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs: 
        villano:
            description: "¿Qué villano envía el mensaje?"
            required: true
            type: choice
            options: 
                - Lex
                - Magento
                - Mystique
jobs:
  
  transmitir-mensajes:    
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v4
